# Single source of Android dependency and plugin versions (pinned; update THIRD_PARTY_NOTICES.md and docs/TECHNICAL.md on change)
[versions]
agp = "9.4.1"
kotlin = "2.4.21"
compose-bom = "2026.09.00"
activity = "1.13.0"
lifecycle = "2.11.0"
core-ktx = "1.19.1"
splashscreen = "1.2.0"
adaptive = "1.3.0"
icons-extended = "1.7.8"
navigation3 = "1.2.0"
biometric = "1.1.0"
fragment = "1.5.4"
camerax = "1.6.2"
datastore = "1.3.0"
documentfile = "1.1.0"
zxing = "3.5.4"
jna = "5.19.1"
coroutines = "1.11.0"
junit = "4.13.2"
org-json = "20250517"
# HTTP executor for cloud storage backup (5.5.0: 5.5.1 was less than two weeks old when pinned)
okhttp = "5.5.0"
# Instrumented tests (run on a device / emulator via make test-android-device)
androidx-test = "1.7.0"
androidx-test-ext-junit = "1.3.0"
# The espresso 3.5.0 pulled in transitively by ui-test reflectively calls InputManager.getInstance, which Android 17 removed;
# pin 3.7.0 explicitly
androidx-test-espresso = "3.7.0"
# Static analysis (build time only, not in the APK)
ktlint-gradle = "14.2.0"
ktlint-engine = "1.8.0"
detekt = "1.23.8"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material3-adaptive = { module = "androidx.compose.material3.adaptive:adaptive", version.ref = "adaptive" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "icons-extended" }
navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
# MainActivity extends FragmentActivity directly (required by BiometricPrompt), so declare it explicitly instead of relying on
# biometric pulling it in
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
# The org.json in android.jar is only a stub in JVM unit tests; tests use the real implementation
org-json = { module = "org.json:json", version.ref = "org-json" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
# Compose instrumented tests (version from compose-bom) and the AndroidX Test runner
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidx-test" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-test-espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }

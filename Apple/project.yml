# XcodeGen project spec.
# Change the project structure here (targets, dependencies, build settings, source paths), then run from the repo root:
#   make project
# Commit the generated Apple/Kakey.xcodeproj with it; never edit project.pbxproj by hand. Adding or removing source files
# needs no regeneration (targets include whole directories, so new files only need to go in the right folder).
name: Kakey
# Test is a copy of Debug used only by the scheme's test action. It gives the test host a different bundle ID, so the
# single-instance logic (which looks up the bundle ID) does not mistake a running Kakey for an existing instance and quit
# the host, and so the test host has its own UserDefaults domain and never touches real user preferences.
configs:
  Debug: debug
  Test: debug
  Release: release
options:
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 2
    VERSIONING_SYSTEM: apple-generic
    SWIFT_VERSION: "6.0"
    # Swift 6 language mode already implies complete concurrency checking; spelled out so that lowering the language mode
    # cannot silently relax it.
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts.git
    exactVersion: "3.0.1"
targets:
  Kakey:
    type: application
    platform: macOS
    sources:
      # scripts/ and docs/ are not app resources; without these excludes XcodeGen would bundle the .py/.sh/.md files.
      - path: Mac
        excludes:
          - "Tests/**"
          - "docs/**"
          - "scripts/**"
      # Models, core wrappers, localization and string resources shared by Mac and iOS / iPadOS
      - path: Shared
      # UniFFI Swift bindings for the Rust core, generated by make core-apple (see Core/scripts/build-apple.sh)
      - path: ../Build/Core/apple/KakeyCore.swift
        optional: true
        # A fixed group: otherwise XcodeGen names the parent group after the checkout directory, and the generated
        # project would differ between machines
        group: Generated
    dependencies:
      # Static library linked into the main executable, not embedded
      - framework: ../Build/Core/apple/KakeyCore.xcframework
        embed: false
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gicek.kakey
        PRODUCT_NAME: Kakey
        INFOPLIST_FILE: Mac/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Signing defaults to ad-hoc without iCloud. When local.mk sets MAC_DEVELOPMENT_TEAM, the Makefile overrides the
        # KAKEY_* variables below on the command line: development certificate + automatic provisioning +
        # KakeyICloud.entitlements (iCloud backup; see docs/SECURITY.md).
        CODE_SIGN_ENTITLEMENTS: $(KAKEY_MAC_ENTITLEMENTS)
        CODE_SIGN_IDENTITY: $(KAKEY_MAC_SIGN_IDENTITY)
        # Automatic signing: Xcode creates the provisioning profile when a team is configured; ad-hoc ("-") is unaffected.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(KAKEY_DEVELOPMENT_TEAM)
        KAKEY_MAC_ENTITLEMENTS: Mac/Kakey.entitlements
        KAKEY_MAC_SIGN_IDENTITY: "-"
        KAKEY_ICLOUD_CONTAINER: ""
        KAKEY_ICLOUD_ENVIRONMENT: Development
        KAKEY_APS_ENVIRONMENT: development
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Test:
          PRODUCT_BUNDLE_IDENTIFIER: com.gicek.kakey.testhost
        Release:
          KAKEY_ICLOUD_ENVIRONMENT: Production
          KAKEY_APS_ENVIRONMENT: production
  # iOS / iPadOS (one target shared by iPhone and iPad)
  KakeyMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iOS
        excludes:
          - "Tests/**"
          - "docs/**"
          - "scripts/**"
      - path: Shared
      - path: ../Build/Core/apple/KakeyCore.swift
        optional: true
        # A fixed group: otherwise XcodeGen names the parent group after the checkout directory, and the generated
        # project would differ between machines
        group: Generated
    dependencies:
      - framework: ../Build/Core/apple/KakeyCore.xcframework
        embed: false
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Kakey
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans, zh-Hant]
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Kakey uses the camera to scan 2FA QR codes. Images are processed on this device only.
        NSFaceIDUsageDescription: Kakey uses Face ID to unlock your encrypted vault.
        ITSAppUsesNonExemptEncryption: false
        # iCloud backup (see docs/SECURITY.md): the container comes from the signing configuration and is empty without a
        # development team, which disables the iCloud option. Silent pushes wake the app to sync changes from other devices.
        KakeyICloudContainer: $(KAKEY_ICLOUD_CONTAINER)
        UIBackgroundModes: [remote-notification]
        # Cloud storage backup allows plaintext HTTP to self-hosted WebDAV / Nextcloud once the user confirms it (hosts are
        # user-entered, so they cannot be declared per domain). The real restriction is cloudset's origin check in the core
        # (see docs/SECURITY.md).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Authorization through the official Dropbox app: allows querying whether the app is installed (App Store and
        # enterprise editions) and registers the db-<app key> redirect scheme (generated from cloud-keys.toml at build
        # time, see IOS_CLOUD_FLAGS in the Makefile; an unused placeholder when not configured).
        LSApplicationQueriesSchemes: [dbapi-2, dbapi-8-emm]
        CFBundleURLTypes:
          - CFBundleURLName: com.gicek.kakey.dropbox
            CFBundleURLSchemes: [$(KAKEY_DROPBOX_URL_SCHEME), $(KAKEY_DROPBOX_FULL_URL_SCHEME)]
        # Private drag type for reordering cards on iPad, visible only within this app (same identifier as on Mac)
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.gicek.kakey.account-reorder
            UTTypeDescription: Kakey account reorder token
            UTTypeConformsTo: [public.item]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gicek.kakey
        PRODUCT_NAME: Kakey
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(KAKEY_DEVELOPMENT_TEAM)
        # As on Mac: when DEVELOPMENT_TEAM is set, the Makefile switches to KakeyICloud.entitlements and fills in the
        # container.
        CODE_SIGN_ENTITLEMENTS: $(KAKEY_IOS_ENTITLEMENTS)
        KAKEY_IOS_ENTITLEMENTS: ""
        KAKEY_ICLOUD_CONTAINER: ""
        KAKEY_ICLOUD_ENVIRONMENT: Development
        KAKEY_APS_ENVIRONMENT: development
        KAKEY_DROPBOX_URL_SCHEME: com.gicek.kakey.unused-dropbox
        KAKEY_DROPBOX_FULL_URL_SCHEME: com.gicek.kakey.unused-dropbox-full
      configs:
        Test:
          PRODUCT_BUNDLE_IDENTIFIER: com.gicek.kakey.testhost
        Release:
          KAKEY_ICLOUD_ENVIRONMENT: Production
          KAKEY_APS_ENVIRONMENT: production
  KakeyMobileTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iOS/Tests
      # In-memory WebDAV executor and iCloud store, shared by the Mac and iOS tests
      - path: Mac/Tests/MemoryDavExecutor.swift
      - path: Mac/Tests/MemoryICloudVaultStore.swift
    dependencies:
      - target: KakeyMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gicek.kakey.mobile.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Kakey.app/Kakey
        BUNDLE_LOADER: $(TEST_HOST)
  KakeyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Mac/Tests
    dependencies:
      - target: Kakey
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gicek.kakey.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Kakey:
    build:
      targets:
        Kakey: all
    run:
      config: Debug
    test:
      config: Test
      targets:
        - KakeyTests
    archive:
      config: Release
  KakeyMobile:
    build:
      targets:
        KakeyMobile: all
    run:
      config: Debug
    test:
      config: Test
      targets:
        - KakeyMobileTests
    archive:
      config: Release
